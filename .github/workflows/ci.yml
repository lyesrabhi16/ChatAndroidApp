name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: Server (MySQL + end-to-end smoke test)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: ChatDB
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: ci-root
      DB_NAME: ChatDB
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
      UPLOAD_DIR: /tmp/chat-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load the sample database
        run: mysql -h 127.0.0.1 -uroot -pci-root ChatDB < chatdb.sql
      - name: Start the server
        run: |
          node server.js > server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8001/ && break
            sleep 1
          done
      - name: Smoke test
        run: npm run smoke
      - name: Server log
        if: failure()
        run: cat server.log

  android:
    name: Android (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the debug APK and run the unit tests
        run: ./gradlew assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
